name: Feature request
description: An idea to make Plainly more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today? Who runs into it?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked the non-goals in PRD.md (no OCR, vector search, teams or mobile app).
          required: true
