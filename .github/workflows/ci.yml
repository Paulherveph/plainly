name: CI

# Runs on every PR (no path filter): `check` and `e2e` are required by the main ruleset,
# and a required check that never starts would block docs-only PRs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54325
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      USE_FAKE_AI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1 # same as supabase.yml; bump both with the local CLI
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase env
        run: |
          supabase status -o env --override-name api.url=NEXT_PUBLIC_SUPABASE_URL --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --override-name auth.secret_key=SUPABASE_SECRET_KEY >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plainly/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          USE_FAKE_AI: "true"
